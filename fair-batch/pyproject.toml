[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fair-batch"
version = "0.1.0"
description = "Fairness + power-aware continuous-batching simulator (DRR, DVFS cap, KV admission)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["matplotlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["fair_batch*"]
