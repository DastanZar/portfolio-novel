[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gate-keep"
version = "0.1.0"
description = "Learned gate + latent memory for KV-cache compression (novel, CPU-only)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.22", "matplotlib>=3.5"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["gate_keep*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
