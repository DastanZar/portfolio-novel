[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cache-roof"
version = "0.1.0"
description = "Cache-aware roofline harness with confidence intervals"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cache_roof*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
