[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "block-evict"
version = "0.1.0"
description = "Block-aligned eviction for PagedAttention-style KV caches (COW prefix sharing retained)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["matplotlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["block_evict*"]
