[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "green-roof"
version = "0.1.0"
description = "Cost/carbon/SLO roofline capacity planner"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["matplotlib"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
green-roof = "green_roof.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["green_roof*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
