[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kurt-switch"
version = "0.1.0"
description = "Per-row kurtosis-switched 4-bit codebooks with LS scale"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "torch", "matplotlib>=3.6"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["kurt_switch"]
