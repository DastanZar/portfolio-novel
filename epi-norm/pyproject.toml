[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "epi-norm"
version = "0.1.0"
description = "RMSNorm+residual+SwiGLU epilogue fusion with recompute-vs-store explorer (novel, CPU-only)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.22", "matplotlib>=3.5"]

[project.optional-dependencies]
test = ["pytest>=7"]
triton = ["torch", "triton"]

[tool.setuptools.packages.find]
include = ["epi_norm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
